<!doctype html>
<html lang="ru" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'"
    />
    <title>Clauden Code</title>
    <link rel="stylesheet" href="app.css" />
  </head>
  <body>
    <div id="root"></div>
    <script>
      window.__ccErrors = [];
      window.addEventListener("error", (event) => {
        window.__ccErrors.push(String(event.message || event.error || "error"));
      });
      window.addEventListener("unhandledrejection", (event) => {
        window.__ccErrors.push(String(event.reason?.message || event.reason || "rejection"));
      });
    </script>
    <script src="vendor/marked.min.js"></script>
    <script src="vendor/purify.min.js"></script>
    <script src="vendor/highlight.min.js"></script>
    <script type="module" src="js/app.js"></script>
  </body>
</html>
