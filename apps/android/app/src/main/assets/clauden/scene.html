<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="color-scheme" content="dark">
<title>Clauden</title>
<style>
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    background: transparent;
    color-scheme: dark;
    overflow: hidden;
  }
  #stage {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  img {
    max-width: 94%;
    max-height: 94%;
    width: auto;
    height: auto;
    filter: drop-shadow(0 14px 28px rgba(0, 0, 0, .42));
  }
</style>
<body>
<div id="stage"><img id="pic" alt=""></div>
<script>
  var raw = (location.hash || '#scene-open-chat').slice(1);
  var name = raw.replace(/[^a-z-]/gi, '') || 'scene-open-chat';
  document.getElementById('pic').src = 'scenes/' + name + '.svg';
</script>
</html>
