<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 240" width="600" height="480" role="img" aria-label="Clauden — думает">
<title>Clauden — думает</title>
<style>.cl-gaze,.cl-eye,.cl-bob,.cl-panel,.cl-fab,.cl-plus,.cl-ripple,.cl-dot,.cl-key,
.cl-caret,.cl-check,.cl-check-path,.cl-keys{animation-play-state:running}
.cl-bob{transform-box:view-box}
.cl-eye{transform-box:fill-box;transform-origin:50% 50%}
@media (prefers-reduced-motion:reduce){[class*="cl-"]{animation:none!important}}.cl-bob{transform-origin:150px 152px;animation:th-sway 4.2s ease-in-out infinite}
@keyframes th-sway{
0%,100%{transform:translateY(0) rotate(0deg) scale(1,1)}
30%{transform:translateY(-1.4px) rotate(-2deg) scale(1.012,.995)}
60%{transform:translateY(.6px) rotate(1.6deg) scale(.995,1.008)}
85%{transform:translateY(-.4px) rotate(-.5deg) scale(1.004,1)}
}
.cl-dot{transform-box:fill-box;transform-origin:50% 50%;animation:th-dot 1.4s ease-in-out infinite}
.cl-dot.d2{animation-delay:.18s}
.cl-dot.d3{animation-delay:.36s}
@keyframes th-dot{
0%,100%{opacity:.25;transform:translateY(0) scale(.9)}
28%{opacity:1;transform:translateY(-3px) scale(1)}
55%{opacity:.25;transform:translateY(0) scale(.9)}
}
.cl-gaze{animation:th-gaze 4.2s linear infinite}
@keyframes th-gaze{
0%,8%{transform:translate(0,0);animation-timing-function:cubic-bezier(.3,.9,.35,1.3)}
16%{transform:translate(0,-.95px);animation-timing-function:linear}
34%{transform:translate(0,-.95px);animation-timing-function:cubic-bezier(.3,.9,.35,1.3)}
42%{transform:translate(1.2px,-.7px);animation-timing-function:linear}
56%{transform:translate(1.2px,-.7px);animation-timing-function:cubic-bezier(.3,.9,.35,1.3)}
64%{transform:translate(-.9px,-.3px);animation-timing-function:linear}
76%{transform:translate(-.9px,-.3px);animation-timing-function:cubic-bezier(.3,.9,.35,1.3)}
84%{transform:translate(0,0);animation-timing-function:linear}
100%{transform:translate(0,0)}
}
.cl-eye{animation:th-blink 4.2s linear infinite}
@keyframes th-blink{
0%,62%,65%,100%{transform:scale(1,1)}
63.5%{transform:scale(1.08,.06)}
}</style>
