<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 240" width="600" height="480" role="img" aria-label="Clauden — отправляет сообщение">
<title>Clauden — отправляет сообщение</title>
<style>.cl-gaze,.cl-eye,.cl-bob,.cl-panel,.cl-fab,.cl-plus,.cl-ripple,.cl-dot,.cl-key,
.cl-caret,.cl-check,.cl-check-path,.cl-keys{animation-play-state:running}
.cl-bob{transform-box:view-box}
.cl-eye{transform-box:fill-box;transform-origin:50% 50%}
@media (prefers-reduced-motion:reduce){[class*="cl-"]{animation:none!important}}.cl-bob{transform-origin:150px 172px;animation:se-bob 3.6s ease-in-out infinite}
@keyframes se-bob{
0%,10%{transform:translateY(0) scale(1,1)}
15%{transform:translateY(2px) scale(1.045,.945)}
22%{transform:translateY(-2px) scale(.985,1.018)}
28%,100%{transform:translateY(0) scale(1,1)}
}
.cl-bubble{transform-box:view-box;transform-origin:150px 125px;opacity:0;
  animation:se-bubble 3.6s cubic-bezier(.3,.7,.4,1) infinite}
@keyframes se-bubble{
0%,9%{opacity:0;transform:translateY(0) scale(.9)}
12%{opacity:1;transform:translateY(0) scale(1)}
17%{opacity:1;transform:translateY(-6px) scale(1)}
36%{opacity:1;transform:translateY(-52px) scale(.72)}
41%,100%{opacity:1;transform:translateY(-56px) scale(.66)}
}
.cl-newline{transform-box:fill-box;transform-origin:0 50%;animation:se-line 3.6s ease-out infinite}
@keyframes se-line{
0%,15%{opacity:0;transform:scaleX(.1)}
24%,72%{opacity:1;transform:scaleX(1)}
80%,100%{opacity:0;transform:scaleX(1)}
}
.cl-gaze{animation:se-gaze 3.6s linear infinite}
@keyframes se-gaze{
0%,6%{transform:translate(0,0);animation-timing-function:cubic-bezier(.3,.9,.35,1.3)}
13%{transform:translate(0,-.9px);animation-timing-function:linear}
56%{transform:translate(0,-.9px);animation-timing-function:cubic-bezier(.3,.9,.35,1.3)}
64%{transform:translate(0,0);animation-timing-function:linear}
100%{transform:translate(0,0)}
}
.cl-eye{animation:se-blink 3.6s linear infinite}
@keyframes se-blink{
0%,62%,65%,100%{transform:scale(1,1)}
63.5%{transform:scale(1.08,.06)}
}</style>
