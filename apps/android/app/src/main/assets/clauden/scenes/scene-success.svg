<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" width="600" height="400" role="img" aria-label="Clauden — готово">
<title>Clauden — готово</title>
<style>.cl-gaze,.cl-eye,.cl-bob,.cl-panel,.cl-fab,.cl-plus,.cl-ripple,.cl-dot,.cl-key,
.cl-caret,.cl-check,.cl-check-path,.cl-keys{animation-play-state:running}
.cl-bob{transform-box:view-box}
.cl-eye{transform-box:fill-box;transform-origin:50% 50%}
@media (prefers-reduced-motion:reduce){[class*="cl-"]{animation:none!important}}.cl-bob{transform-origin:133px 116px;animation:su-bob 4.2s ease-in-out infinite}
@keyframes su-bob{
0%,6%{transform:translateY(0) scale(1,1)}
12%{transform:translateY(-6px) scale(.97,1.05)}
17%{transform:translateY(0) scale(1.045,.955)}
22%{transform:translateY(-1.6px) scale(.99,1.012)}
27%,72%{transform:translateY(0) scale(1,1)}
84%{transform:translateY(.5px) scale(1.008,.993)}
100%{transform:translateY(0) scale(1,1)}
}
.cl-check{transform-box:view-box;transform-origin:181px 77px;animation:su-pop 4.2s cubic-bezier(.2,.9,.3,1.2) infinite}
@keyframes su-pop{
0%,4%{opacity:0;transform:scale(.4)}
12%,84%{opacity:1;transform:scale(1)}
90%,100%{opacity:0;transform:scale(.85)}
}
.cl-check-path{stroke-dasharray:34;stroke-dashoffset:34;animation:su-draw 4.2s ease-out infinite}
@keyframes su-draw{
0%,9%{stroke-dashoffset:34}
19%,88%{stroke-dashoffset:0}
92%,100%{stroke-dashoffset:46}
}
.cl-gaze{animation:su-gaze 4.2s linear infinite}
@keyframes su-gaze{
0%,10%{transform:translate(0,0);animation-timing-function:cubic-bezier(.3,.9,.35,1.3)}
18%{transform:translate(0,-.75px);animation-timing-function:linear}
44%{transform:translate(0,-.75px);animation-timing-function:cubic-bezier(.3,.9,.35,1.3)}
52%{transform:translate(0,0);animation-timing-function:linear}
100%{transform:translate(0,0)}
}
.cl-eye{animation:su-blink 4.2s linear infinite}
@keyframes su-blink{
0%,23.4%,26.4%,86%,89%,100%{transform:scale(1,1)}
25%,87.5%{transform:scale(1.08,.06)}
}
.cl-eyes-normal{animation:su-normal 4.2s step-end infinite}
@keyframes su-normal{0%,25%{opacity:1}26%,86%{opacity:0}87%,100%{opacity:1}}
.cl-eyes-happy{opacity:0;animation:su-happy 4.2s step-end infinite}
@keyframes su-happy{0%,25%{opacity:0}26%,86%{opacity:1}87%,100%{opacity:0}}</style>
