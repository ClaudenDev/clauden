<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 300" width="640" height="600" role="img" aria-label="Clauden — печатает">
<title>Clauden — печатает</title>
<style>.cl-gaze,.cl-eye,.cl-bob,.cl-panel,.cl-fab,.cl-plus,.cl-ripple,.cl-dot,.cl-key,
.cl-caret,.cl-check,.cl-check-path,.cl-keys{animation-play-state:running}
.cl-bob{transform-box:view-box}
.cl-eye{transform-box:fill-box;transform-origin:50% 50%}
@media (prefers-reduced-motion:reduce){[class*="cl-"]{animation:none!important}}.cl-bob{transform-origin:160px 142px;animation:tp-bob .48s ease-in-out infinite}
@keyframes tp-bob{0%,100%{transform:translateY(0) scale(1,1)}
  50%{transform:translateY(.7px) scale(1.007,.987)}}
.cl-key{transform-box:fill-box;transform-origin:50% 50%;animation:tp-tap 4.8s linear infinite}
@keyframes tp-tap{0%,1.1%{transform:translateY(0);fill-opacity:.085}
  1.7%{transform:translateY(2.4px);fill-opacity:.34}
  3.4%,100%{transform:translateY(0);fill-opacity:.085}}
.cl-gaze{animation:tp-gaze 4.8s linear infinite}
@keyframes tp-gaze{
0%,6%{transform:translate(0,.35px);animation-timing-function:cubic-bezier(.3,.9,.35,1.3)}
14%{transform:translate(-.9px,.4px);animation-timing-function:linear}
26%{transform:translate(-.9px,.4px);animation-timing-function:cubic-bezier(.3,.9,.35,1.3)}
34%{transform:translate(.9px,.4px);animation-timing-function:linear}
46%{transform:translate(.9px,.4px);animation-timing-function:cubic-bezier(.3,.9,.35,1.3)}
54%{transform:translate(0,.42px);animation-timing-function:linear}
74%{transform:translate(0,.42px);animation-timing-function:cubic-bezier(.3,.9,.35,1.3)}
82%{transform:translate(-.35px,.2px);animation-timing-function:linear}
100%{transform:translate(0,.35px)}
}
.cl-eye{animation:tp-eye 4.8s linear infinite}
@keyframes tp-eye{
0%,13%{transform:scale(1.08,.6)}
16%{transform:scale(1.05,.08)}
19%,42%{transform:scale(1.08,.6)}
45%{transform:scale(1.05,.08)}
48%,76%{transform:scale(1.06,.64)}
79%{transform:scale(1,1)}
86%,94%{transform:scale(1,.85)}
97%,100%{transform:scale(1.08,.6)}
}
.cl-caret{animation:tp-caret 1.2s step-end infinite}
@keyframes tp-caret{0%,49%{opacity:1}50%,100%{opacity:0}}</style>
