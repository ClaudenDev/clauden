<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 300" width="640" height="600" role="img" aria-label="Clauden — открывает чат">
<title>Clauden — открывает чат</title>
<style>.cl-gaze,.cl-eye,.cl-bob,.cl-panel,.cl-fab,.cl-plus,.cl-ripple,.cl-dot,.cl-key,
.cl-caret,.cl-check,.cl-check-path,.cl-keys{animation-play-state:running}
.cl-bob{transform-box:view-box}
.cl-eye{transform-box:fill-box;transform-origin:50% 50%}
@media (prefers-reduced-motion:reduce){[class*="cl-"]{animation:none!important}}.cl-bob{transform-origin:160px 86px;animation:oc-bob 6s ease-in-out infinite}
@keyframes oc-bob{
0%,22%{transform:translateY(0) scale(1,1)}
27%{transform:translateY(-7px) scale(1.045,.945)}
32%{transform:translateY(0) scale(.978,1.026)}
37%{transform:translateY(-1px) scale(1.006,.994)}
42%,72%{transform:translateY(0) scale(1,1)}
80%{transform:translateY(.4px) scale(1.012,.992)}
100%{transform:translateY(0) scale(1,1)}
}
.cl-panel{transform-box:fill-box;transform-origin:50% 100%;
  animation:oc-panel 6s cubic-bezier(.2,.85,.25,1.05) infinite}
@keyframes oc-panel{
0%,22%{opacity:0;transform:translateY(8px) scale(.93)}
29%{opacity:1;transform:translateY(0) scale(1)}
79%{opacity:1;transform:translateY(0) scale(1)}
85%{opacity:0;transform:translateY(7px) scale(.95)}
100%{opacity:0;transform:translateY(8px) scale(.93)}
}
.cl-fab{transform-box:view-box;transform-origin:160px 250px;animation:oc-fab 6s ease-in-out infinite}
@keyframes oc-fab{
0%,18%{transform:scale(1)}
22%{transform:scale(.87)}
26%{transform:scale(1)}
82%{transform:scale(1)}
85%{transform:scale(.9)}
89%,100%{transform:scale(1)}
}
.cl-plus{transform-box:view-box;transform-origin:160px 250px;transform:rotate(45deg);
  animation:oc-plus 6s cubic-bezier(.3,.9,.3,1.15) infinite}
@keyframes oc-plus{
0%,25%{transform:rotate(0deg)}
31%,80%{transform:rotate(45deg)}
84%,100%{transform:rotate(0deg)}
}
.cl-ripple{transform-box:view-box;transform-origin:160px 250px;opacity:0;
  animation:oc-ripple 6s ease-out infinite}
@keyframes oc-ripple{
0%,20%{opacity:0;transform:scale(1)}
22%{opacity:.55;transform:scale(1)}
31%{opacity:0;transform:scale(1.9)}
100%{opacity:0;transform:scale(1.9)}
}
.cl-l1{transform-box:fill-box;transform-origin:0 50%;animation:oc-line1 6s ease-out infinite}
@keyframes oc-line1{
0%,26%{opacity:0;transform:scaleX(.25)}
36%,79%{opacity:1;transform:scaleX(1)}
85%,100%{opacity:0;transform:scaleX(1)}
}
.cl-l2{transform-box:fill-box;transform-origin:100% 50%;animation:oc-line2 6s ease-out infinite}
@keyframes oc-line2{
0%,32%{opacity:0;transform:scaleX(.3)}
42%,79%{opacity:1;transform:scaleX(1)}
85%,100%{opacity:0;transform:scaleX(1)}
}
.cl-gaze{animation:oc-gaze 6s linear infinite}
@keyframes oc-gaze{
0%,4%{transform:translate(0,0);animation-timing-function:cubic-bezier(.3,.9,.35,1.3)}
9%{transform:translate(0,.62px);animation-timing-function:linear}
22%{transform:translate(0,.62px);animation-timing-function:cubic-bezier(.3,.9,.35,1.3)}
28%{transform:translate(-.2px,.3px);animation-timing-function:linear}
35%{transform:translate(-.2px,.3px);animation-timing-function:cubic-bezier(.3,.9,.35,1.3)}
42%{transform:translate(1.15px,.15px);animation-timing-function:linear}
52%{transform:translate(1.15px,.15px);animation-timing-function:cubic-bezier(.3,.9,.35,1.3)}
58%{transform:translate(.1px,-.55px);animation-timing-function:linear}
68%{transform:translate(.1px,-.55px);animation-timing-function:cubic-bezier(.3,.9,.35,1.3)}
74%{transform:translate(0,0);animation-timing-function:linear}
100%{transform:translate(0,0)}
}
.cl-eye{animation:oc-blink 6s linear infinite}
@keyframes oc-blink{
0%,38.6%,41.6%,72%,75%,100%{transform:scale(1,1)}
40.1%,73.5%{transform:scale(1.08,.06)}
}</style>
<defs>
<mask id="m-open-chat" maskUnits="userSpaceOnUse" x="0" y="0" width="320" height="300">
<rect x="0" y="0" width="320" height="300" fill="#fff"/>
<g class="cl-gaze"><path class="cl-eye" d="M 154.53 90.94C 153.71 90.72 153.12 90.07 152.79 88.98C 152.37 87.62 152.42 83.87 152.88 82.66C 153.53 80.89 155.53 80.34 156.79 81.55C 157.27 82.02 157.42 82.33 157.66 83.25C 157.81 83.84 157.84 84.30 157.84 85.86C 157.84 88.89 157.49 90.03 156.36 90.69C 155.89 90.97 155.07 91.08 154.53 90.94Z" fill="#000"/><path class="cl-eye" d="M 165.39 90.90C 164.09 90.41 163.50 88.96 163.50 86.18C 163.49 84.72 163.66 83.27 163.89 82.63C 164.39 81.30 165.71 80.59 166.94 81.02C 167.58 81.25 168.05 81.69 168.37 82.34C 168.79 83.23 168.88 83.93 168.83 86.30C 168.78 88.68 168.65 89.29 168.05 90.09C 167.46 90.85 166.25 91.21 165.39 90.90Z" fill="#000"/></g>
</mask>
</defs>

