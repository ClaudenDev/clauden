  <circle cx="62" cy="160" r="7" fill="#d97746" fill-opacity=".9"/>
  <rect class="cl-l1" x="78" y="154" width="112" height="7" rx="3.5" fill="#fff" fill-opacity=".32"/>
  <rect class="cl-l1" x="78" y="166" width="74" height="7" rx="3.5" fill="#fff" fill-opacity=".16"/>
  <rect class="cl-l2" x="172" y="196" width="90" height="18" rx="9" fill="#d97746" fill-opacity=".8"/>
</g>
