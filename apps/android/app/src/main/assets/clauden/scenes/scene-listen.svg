<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 252" width="600" height="504" role="img" aria-label="Clauden — слушает">
<title>Clauden — слушает</title>
<style>.cl-gaze,.cl-eye,.cl-bob,.cl-panel,.cl-fab,.cl-plus,.cl-ripple,.cl-dot,.cl-key,
.cl-caret,.cl-check,.cl-check-path,.cl-keys{animation-play-state:running}
.cl-bob{transform-box:view-box}
.cl-eye{transform-box:fill-box;transform-origin:50% 50%}
@media (prefers-reduced-motion:reduce){[class*="cl-"]{animation:none!important}}.cl-bob{transform-origin:150px 120px;animation:ls-bob 4.8s ease-in-out infinite}
@keyframes ls-bob{
0%,100%{transform:translateY(0) rotate(0deg) scale(1,1)}
25%{transform:translateY(-1.6px) rotate(-1.6deg) scale(1.012,.994)}
55%{transform:translateY(.5px) rotate(1.2deg) scale(.995,1.006)}
80%{transform:translateY(-.6px) rotate(-.4deg) scale(1.004,1)}
}
.cl-wave{transform-box:fill-box;transform-origin:50% 100%;animation:ls-wave 1.2s ease-in-out infinite}
@keyframes ls-wave{0%,100%{transform:scaleY(.42)}45%{transform:scaleY(1)}70%{transform:scaleY(.62)}}
.cl-ring{transform-box:view-box;transform-origin:150px 212px;opacity:0;
  animation:ls-ring 2.4s ease-out infinite}
.cl-ring.r2{animation-delay:1.2s}
@keyframes ls-ring{
0%{opacity:0;transform:scale(1)}
12%{opacity:.5;transform:scale(1)}
55%{opacity:0;transform:scale(1.85)}
100%{opacity:0;transform:scale(1.85)}
}
.cl-gaze{animation:ls-gaze 4.8s linear infinite}
@keyframes ls-gaze{
0%,8%{transform:translate(0,0);animation-timing-function:cubic-bezier(.3,.9,.35,1.3)}
16%{transform:translate(-1.1px,.1px);animation-timing-function:linear}
32%{transform:translate(-1.1px,.1px);animation-timing-function:cubic-bezier(.3,.9,.35,1.3)}
40%{transform:translate(1.2px,-.2px);animation-timing-function:linear}
56%{transform:translate(1.2px,-.2px);animation-timing-function:cubic-bezier(.3,.9,.35,1.3)}
64%{transform:translate(0,-.75px);animation-timing-function:linear}
78%{transform:translate(0,-.75px);animation-timing-function:cubic-bezier(.3,.9,.35,1.3)}
86%{transform:translate(0,0);animation-timing-function:linear}
100%{transform:translate(0,0)}
}
.cl-eye{animation:ls-blink 4.8s linear infinite}
@keyframes ls-blink{
0%,54%,57%,100%{transform:scale(1,1)}
55.5%{transform:scale(1.1,.06)}
}</style>
