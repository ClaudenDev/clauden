services:
  gateway:
    build: ..
    restart: unless-stopped
    env_file: ../.env
    ports:
      - "127.0.0.1:8788:8788"
    volumes:
      - ../data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8788/health"]
      interval: 30s
      timeout: 3s
      retries: 3
