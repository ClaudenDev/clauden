server {
    listen 443 ssl http2;
    server_name clauden.best;

    ssl_certificate     /etc/letsencrypt/live/clauden.best/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/clauden.best/privkey.pem;

    root /srv/clauden/app/web;
    index index.html;

    client_max_body_size 64m;

    # статика: index.html и sw.js всегда свежие, остальное кешируется
    location = /index.html {
        add_header cache-control "no-store";
        try_files $uri =404;
    }
    location = /sw.js {
        add_header cache-control "no-store";
        try_files $uri =404;
    }
    location ~ ^/(css|js|fonts|icons|assets|vendor)/ {
        add_header cache-control "public, max-age=604800";
        try_files $uri =404;
    }

    # шлюз
    location ~ ^/(v1|files|health)(/|$) {
        proxy_pass http://127.0.0.1:8788;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
        chunked_transfer_encoding on;
    }

    # клиентские маршруты
    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 80;
    server_name clauden.best;
    return 301 https://$host$request_uri;
}
